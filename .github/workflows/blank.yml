<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dudu Nunes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #000000, #0f0f0f);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .card {
      background: #111;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 0 20px rgba(255,255,255,0.05);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 26px;
      letter-spacing: 1px;
    }

    p {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 30px;
    }

    a {
      display: block;
      text-decoration: none;
      color: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-weight: bold;
      transition: 0.3s;
    }

    .insta {
      background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
    }

    .zap {
      background: #25d366;
    }

    a:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Dudu Nunes</h1>
    <p>Your limit is only your mind</p>

    <a class="insta" href="https://instagram.com/dudu_nunesns" target="_blank">
      Instagram
    </a>

    <a class="zap" href="https://wa.me/5500000000000" target="_blank">
      WhatsApp
    </a>
  </div>
</body>
</html>
